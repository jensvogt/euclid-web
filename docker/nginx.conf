# Serves the bundle, and puts the euclid gateway behind /euclid on the same origin.
#
# The reverse proxy is not a convenience. Every call this UI makes carries x-euclid-target and
# x-euclid-action headers, and euclid's gateway answers a cross-origin preflight for those with a 404 -
# its CORS allows only Content-Type, Authorization and X-Requested-With, and a preflight carries none of
# the x-euclid-* headers for the gateway to route on. Same origin means no preflight at all.
#
# EUCLID_GATEWAY is substituted at container start - see the Dockerfile's entrypoint.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The gateway. The trailing slash on proxy_pass is what strips the /euclid prefix, so a POST to
    # /euclid/ arrives at / - which is the only path euclid's header-routed dispatch answers on.
    location /euclid/ {
        proxy_pass ${EUCLID_GATEWAY}/;
        proxy_http_version 1.1;

        # euclid serves TLS on its gateway port with a certificate the installation generated, which is
        # not in the container's trust store. The hop is container-to-server on an internal network; put a
        # trusted certificate in the image and turn this on if that is not good enough for the deployment.
        proxy_ssl_verify off;
        proxy_ssl_server_name on;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # receive-messages and receive-events hold the connection open for up to twenty seconds on
        # purpose, so the read timeout has to outlast a long poll rather than cut it off.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Objects go through this too, and ESM has no small maximum of its own.
        client_max_body_size 512m;
        proxy_request_buffering off;
    }

    # An Angular app owns its routes, so anything that is not a file is index.html and the router
    # sorts it out.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so these can be cached indefinitely. index.html cannot - it is what points at
    # the current hashes.
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
