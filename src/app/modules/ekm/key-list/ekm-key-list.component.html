<mat-card appearance="outlined" style="margin: 3px;">
    <mat-card-header>
        <button (click)="back()" aria-label="Back" mat-icon-button>
            <mat-icon>arrow_back</mat-icon>
        </button>
        <span class="fill-remaining-space">Keys ({{ total$ | async }})</span>
        <button (click)="createKey()" [matTooltipShowDelay]="1000" aria-label="Create" mat-icon-button
                matTooltip="Create a new key">
            <mat-icon>add</mat-icon>
        </button>
        <button (click)="refresh()" [matTooltipShowDelay]="1000" aria-label="Refresh" mat-icon-button
                matTooltip="Refresh the key list">
            <mat-icon>refresh</mat-icon>
        </button>
        <button [matTooltipShowDelay]="1000" [routerLink]="['/metrics/ekm']" aria-label="Monitoring" mat-icon-button
                matTooltip="Monitoring of the EKM counters">
            <mat-icon>
                <span class="material-symbols-outlined">monitoring</span>
            </mat-icon>
        </button>
        <button [matTooltipShowDelay]="1000" [routerLink]="['/ekm-certificate-list']" aria-label="Certificates"
                mat-icon-button matTooltip="Certificates">
            <mat-icon>workspace_premium</mat-icon>
        </button>
        <button [matMenuTriggerFor]="mainmenu" [matTooltipShowDelay]="1000" aria-label="Main menu" mat-icon-button
                matTooltip="More...">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #mainmenu="matMenu" xPosition="before">
            <button (click)="autoReload()" mat-menu-item>
                <mat-icon>
                    <span class="material-symbols-outlined">hourglass</span>
                </mat-icon>
                <span>Auto Reload</span>
            </button>
        </mat-menu>
    </mat-card-header>
    <mat-card-content>
        <mat-card appearance="outlined" style="margin: -10px;">
            <mat-card-actions align="start">
                <mat-form-field style="width:100%">
                    <mat-label>Prefix</mat-label>
                    <input (keyup.enter)="setPrefix()" [(ngModel)]="prefixValue" matInput name="search"
                           placeholder="Search" type="text">
                    @if (prefixSet) {
                        <button (click)="unsetPrefix()" mat-icon-button matSuffix style="float: right">
                            <mat-icon matSuffix>close</mat-icon>
                        </button>
                    }
                    <button (click)="setPrefix()" mat-icon-button matSuffix style="float: right">
                        <mat-icon matSuffix>search</mat-icon>
                    </button>
                </mat-form-field>
            </mat-card-actions>
            <div class="table-container">
                <table (matSortChange)="sortChange($event)" [dataSource]="(items$ | async) ?? []"
                       class="mat-elevation-z8 euclid-table" mat-table matSort>
                    <ng-container matColumnDef="name">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="The generated key ID">Key</th>
                        <td *matCellDef="let key" mat-cell>
                            <div class="with-icon">
                                <span class="ern">{{ key.name }}</span>
                                <button [cdkCopyToClipboard]="key.ern" [matTooltipShowDelay]="1000" aria-label="Copy"
                                        mat-icon-button matTooltip="Copy the ERN to the clipboard">
                                    <mat-icon class="copy-icon">content_copy</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="description">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header
                            matTooltip="What this key protects - the only thing that says whether it can be deleted">
                            Description
                        </th>
                        <td *matCellDef="let key" mat-cell>{{ key.description || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="algorithm">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="Algorithm">Algorithm</th>
                        <td *matCellDef="let key" mat-cell>{{ key.algorithm }}</td>
                    </ng-container>
                    <ng-container matColumnDef="length">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="Key length in bits">Length</th>
                        <td *matCellDef="let key" mat-cell>{{ key.length }}</td>
                    </ng-container>
                    <ng-container matColumnDef="status">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header
                            matTooltip="Whether the key is in use, revoked, or scheduled for deletion">Status
                        </th>
                        <td *matCellDef="let key" mat-cell [matTooltip]="key.deletionDate ? 'Deletion: ' + dateConversion(key.deletionDate) : ''">
                            {{ key.status }}
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="created">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="When the key was created">Created</th>
                        <td *matCellDef="let key" mat-cell>{{ dateConversion(key.created) }}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th *matHeaderCellDef mat-header-cell matTooltip="Actions">Actions</th>
                        <td *matCellDef="let key" mat-cell>
                            <!-- `edit` opens the details page here as in every other list; describing the
                                 key moved into the menu, so the icon means one thing across the UI. -->
                            <button [matTooltipShowDelay]="1000" aria-label="Edit" mat-icon-button
                                    matTooltip="Show the key, its status and its tags"
                                    routerLink="./key/{{ key.name }}">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button [matMenuTriggerFor]="keymenu" [matTooltipShowDelay]="1000" aria-label="Key menu"
                                    mat-icon-button matTooltip="More...">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #keymenu="matMenu" xPosition="before">
                                <button (click)="setDescription(key)" mat-menu-item
                                        matTooltip="Change what the key says it is for">
                                    <mat-icon>notes</mat-icon>
                                    <span>Describe key</span>
                                </button>
                                <button (click)="revokeKey(key)" mat-menu-item
                                        matTooltip="Take the key out of use. What it encrypted stays readable.">
                                    <mat-icon>block</mat-icon>
                                    <span>Revoke key</span>
                                </button>
                                <mat-divider/>
                                <button (click)="deleteKey(key)" mat-menu-item
                                        matTooltip="Schedule deletion. Everything it encrypted becomes unreadable.">
                                    <mat-icon>delete</mat-icon>
                                    <span>Schedule deletion</span>
                                </button>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr *matHeaderRowDef="columns" mat-header-row></tr>
                    <tr *matRowDef="let row; columns: columns;" mat-row></tr>
                    <tr *matNoDataRow class="mat-row">
                        <td [attr.colspan]="columns.length" class="mat-cell">No keys here.</td>
                    </tr>
                </table>
            </div>
            <mat-paginator (page)="handlePageEvent($event)"
                           [disabled]="disabled"
                           [hidePageSize]="hidePageSize"
                           [length]="(total$ | async) ?? 0"
                           [pageIndex]="(pageIndex$ | async) ?? 0"
                           [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []"
                           [pageSize]="(pageSize$ | async) ?? 10"
                           [showFirstLastButtons]="showFirstLastButtons"
                           aria-label="Select page" style="width:99%; margin-left:15px">
            </mat-paginator>
        </mat-card>
        <footer-component [lastUpdate]="lastUpdate"/>
    </mat-card-content>
</mat-card>
