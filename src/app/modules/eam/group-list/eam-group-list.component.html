<mat-card appearance="outlined" style="margin: 3px;">
    <mat-card-header>
        <button (click)="back()" aria-label="Back" mat-icon-button>
            <mat-icon>arrow_back</mat-icon>
        </button>
        <span class="fill-remaining-space">User Groups ({{ total$ | async }})</span>
        <button (click)="createGroup()" [matTooltipShowDelay]="1000" aria-label="Create" mat-icon-button
                matTooltip="Create a user group. Administrator only.">
            <mat-icon>group_add</mat-icon>
        </button>
        <button (click)="refresh()" [matTooltipShowDelay]="1000" aria-label="Refresh" mat-icon-button
                matTooltip="Refresh the group list">
            <mat-icon>refresh</mat-icon>
        </button>
        <button [matTooltipShowDelay]="1000" [routerLink]="['/eam-user-list']" aria-label="Users" mat-icon-button
                matTooltip="Users">
            <mat-icon>people</mat-icon>
        </button>
        <button [matMenuTriggerFor]="mainmenu" [matTooltipShowDelay]="1000" aria-label="Main menu" mat-icon-button
                matTooltip="More...">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #mainmenu="matMenu" xPosition="before">
            <button (click)="autoReload()" mat-menu-item>
                <mat-icon>
                    <span class="material-symbols-outlined">hourglass</span>
                </mat-icon>
                <span>Auto Reload</span>
            </button>
        </mat-menu>
    </mat-card-header>
    <mat-card-content>
        <mat-card appearance="outlined" style="margin: -10px;">
            <mat-card-actions align="start">
                <mat-form-field style="width:100%">
                    <mat-label>Prefix</mat-label>
                    <input (keyup.enter)="setPrefix()" [(ngModel)]="prefixValue" matInput name="search"
                           placeholder="Search" type="text">
                    @if (prefixSet) {
                        <button (click)="unsetPrefix()" mat-icon-button matSuffix style="float: right">
                            <mat-icon matSuffix>close</mat-icon>
                        </button>
                    }
                    <button (click)="setPrefix()" mat-icon-button matSuffix style="float: right">
                        <mat-icon matSuffix>search</mat-icon>
                    </button>
                </mat-form-field>
            </mat-card-actions>
            <div class="table-container">
                <table (matSortChange)="sortChange($event)" [dataSource]="(items$ | async) ?? []"
                       class="mat-elevation-z8 euclid-table" mat-table matSort>
                    <ng-container matColumnDef="name">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="Group name">Name</th>
                        <td *matCellDef="let group" mat-cell>
                            <div class="with-icon">
                                <span>{{ group.name }}</span>
                                <button [cdkCopyToClipboard]="group.ern" [matTooltipShowDelay]="1000" aria-label="Copy"
                                        mat-icon-button matTooltip="Copy the ERN to the clipboard">
                                    <mat-icon class="copy-icon">content_copy</mat-icon>
                                </button>
                            </div>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="description">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="What the group is for">
                            Description
                        </th>
                        <td *matCellDef="let group" mat-cell>{{ group.description || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="members">
                        <th *matHeaderCellDef mat-header-cell matTooltip="The users in the group">Members</th>
                        <td *matCellDef="let group" mat-cell>{{ members(group) }}</td>
                    </ng-container>
                    <ng-container matColumnDef="created">
                        <th *matHeaderCellDef mat-header-cell mat-sort-header matTooltip="When the group was created">Created</th>
                        <td *matCellDef="let group" mat-cell>{{ dateConversion(group.created) }}</td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th *matHeaderCellDef mat-header-cell matTooltip="Actions">Actions</th>
                        <td *matCellDef="let group" mat-cell>
                            <button (click)="addUser(group)" [matTooltipShowDelay]="1000" aria-label="Add user"
                                    mat-icon-button matTooltip="Add a user to the group">
                                <mat-icon>person_add</mat-icon>
                            </button>
                            <button [matTooltipShowDelay]="1000" aria-label="Edit" mat-icon-button
                                    matTooltip="Show the group, its members and what it grants"
                                    routerLink="./group/{{ group.name }}">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button [matMenuTriggerFor]="groupmenu" [matTooltipShowDelay]="1000" aria-label="Group menu"
                                    mat-icon-button matTooltip="More...">
                                <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #groupmenu="matMenu" xPosition="before">
                                <button (click)="removeUser(group)" mat-menu-item>
                                    <mat-icon>person_remove</mat-icon>
                                    <span>Remove a user</span>
                                </button>
                                <mat-divider/>
                                <button (click)="deleteGroup(group)" mat-menu-item>
                                    <mat-icon>delete</mat-icon>
                                    <span>Delete group</span>
                                </button>
                            </mat-menu>
                        </td>
                    </ng-container>
                    <tr *matHeaderRowDef="columns" mat-header-row></tr>
                    <tr *matRowDef="let row; columns: columns;" mat-row></tr>
                    <tr *matNoDataRow class="mat-row">
                        <td [attr.colspan]="columns.length" class="mat-cell">No user groups found.</td>
                    </tr>
                </table>
            </div>
            <mat-paginator (page)="handlePageEvent($event)"
                           [disabled]="disabled"
                           [hidePageSize]="hidePageSize"
                           [length]="(total$ | async) ?? 0"
                           [pageIndex]="(pageIndex$ | async) ?? 0"
                           [pageSizeOptions]="showPageSizeOptions ? pageSizeOptions : []"
                           [pageSize]="(pageSize$ | async) ?? 10"
                           [showFirstLastButtons]="showFirstLastButtons"
                           aria-label="Select page" style="width:99%; margin-left:15px">
            </mat-paginator>
        </mat-card>
        <footer-component [lastUpdate]="lastUpdate"/>
    </mat-card-content>
</mat-card>
