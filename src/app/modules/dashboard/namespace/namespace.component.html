<h2 mat-dialog-title>Namespace</h2>
<mat-dialog-content class="mat-typography">
    <mat-form-field class="field">
        <mat-label>Namespace</mat-label>
        <mat-select [(ngModel)]="namespace" [disabled]="loading" name="namespace">
            <mat-option [value]="''">(account root)</mat-option>
            @for (name of namespaces; track name) {
                <mat-option [value]="name">{{ name }}</mat-option>
            }
        </mat-select>
        <mat-hint>{{ hint }}</mat-hint>
    </mat-form-field>
    @if (error) {
        <p class="error">{{ error }}</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    @if (loading || busy) {
        <mat-progress-spinner diameter="20" mode="indeterminate"/>
    }
    <button mat-button mat-dialog-close tabindex="-1">Cancel</button>
    <button (click)="save()" [disabled]="loading || busy" mat-button>Switch</button>
</mat-dialog-actions>
