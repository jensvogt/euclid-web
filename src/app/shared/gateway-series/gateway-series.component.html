<mat-card class="tile mat-elevation-z4">
    <mat-card-header>
        <mat-card-title>{{ title }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        @if (note) {
            <p class="nothing">{{ note }}</p>
        } @else {
            <p class="chart-summary">{{ summary }}</p>
            <div class="chart dashboard-chart" [options]="options" echarts></div>
        }
    </mat-card-content>
</mat-card>
