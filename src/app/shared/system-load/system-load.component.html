<mat-card class="tile mat-elevation-z4">
    <mat-card-header>
        <mat-card-title>System load</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        @if (note) {
            <p class="nothing">{{ note }}</p>
        } @else {
            <div class="figures">
                @for (figure of figures; track figure.label) {
                    <!-- The tooltip is on the wrapper rather than the chart: echarts has its own
                         pointer handling, and the two would fight over the same hover. -->
                    <div class="figure" [matTooltip]="figure.tooltip" [matTooltipShowDelay]="1000">
                        <div class="gauge dashboard-chart" [options]="figure.options" echarts></div>
                        <!-- What the dial above it means, in place rather than only in a tooltip: a
                             gauge nobody can read is a decoration. -->
                        <p class="legend">{{ figure.caption }}</p>
                    </div>
                }
            </div>
        }
    </mat-card-content>
</mat-card>
